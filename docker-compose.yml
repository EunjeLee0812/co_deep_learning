services:
  jupyter:
    build: .
    container_name: co_deep_learning
    volumes:
      # 프로젝트 코드를 컨테이너 /workspace 에 실시간 마운트
      - .:/workspace
    environment:
      # Bela 보드 IP (기본값: 192.168.7.2). 변경하려면 .env 파일에 BELA_IP=<주소> 를 추가하세요.
      - BELA_IP=${BELA_IP:-192.168.7.2}
    restart: unless-stopped

    # ─── Bela 보드 네트워크 연결 설정 ────────────────────────────────────
    #
    # [Linux 환경]
    # USB로 Bela를 연결하면 호스트에 192.168.7.1 인터페이스가 생깁니다.
    # 아래 주석을 해제하면 컨테이너가 호스트 네트워크를 그대로 공유하므로
    # 별도 설정 없이 192.168.7.2(Bela)에 바로 접근할 수 있습니다.
    #
    #   network_mode: host
    #   ports 섹션은 network_mode: host 와 함께 쓸 수 없으므로 함께 주석 처리하세요.
    #
    # [Windows / Mac Docker Desktop 환경]
    # Docker 컨테이너는 USB 이더넷 인터페이스에 직접 접근하지 못합니다.
    # 아래 중 하나를 선택하세요.
    #
    # 방법 1 – extra_hosts 로 호스트를 경유하기 (Windows 권장):
    #   1) extra_hosts 블록 주석 해제
    #   2) Windows PowerShell(관리자)에서 아래 명령어 실행:
    #      route add 192.168.7.0 mask 255.255.255.0 <WSL2_IP>
    #      (WSL2 IP 확인: wsl hostname -I)
    #
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    #
    # 방법 2 – 컨테이너 밖(호스트 터미널)에서 직접 pybela 스크립트 실행
    #   Docker는 Jupyter 환경 통일에만 사용하고,
    #   Bela 스트리밍은 호스트의 venv(또는 conda) 에서 실행합니다.
    # ─────────────────────────────────────────────────────────────────────
